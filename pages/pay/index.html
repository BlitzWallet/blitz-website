<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Pay Lightning invoice · Blitz Wallet</title>
    <link rel="icon" href="/public/favicon/favicon.ico" />
    <!--
      Served at https://blitzwalletapp.com/pay (see netlify.toml). Landing page for the Blitz Telegram bot's "Open wallet" and "Copy
      invoice" buttons: Telegram buttons can't open lightning: links or copy text
      longer than 256 characters, so they link here instead.

        /pay#<invoice>        shows the invoice with Open wallet / Copy buttons
        /pay#open:<invoice>   also hands it to the wallet immediately

      The invoice is in the URL fragment, which browsers never send to the
      server, so it doesn't end up in server logs. No analytics on this page
      for the same reason.
    -->
    <link rel="stylesheet" href="/pages/pay/style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <main>
      <img
        src="/public/favicon/web-app-manifest-512x512.png"
        alt="Blitz Wallet"
      />
      <h1 id="amount">Lightning invoice</h1>
      <p id="hint">Pay with any Lightning wallet.</p>
      <div id="invoice-view" hidden>
        <div class="qr" id="qr" aria-label="Invoice QR code"></div>
        <p class="qr-hint">Scan with your phone's wallet, or use the buttons below.</p>
        <code id="invoice"></code>
        <a id="open" class="btn primary" href="#">Open wallet</a>
        <button id="copy" class="btn" type="button">Copy invoice</button>
      </div>
      <p id="error" hidden>
        This link doesn't contain a valid Lightning invoice.
      </p>
    </main>
    <script src="/pages/pay/script.js"></script>
  </body>
</html>
