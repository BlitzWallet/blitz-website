<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Pay Lightning invoice · Blitz Wallet</title>
    <link rel="icon" href="/public/favicon/favicon.ico" />
    <!--
      Served at https://blitzwalletapp.com/pay (see netlify.toml). Landing page for the Blitz Telegram bot's "Open wallet" and "Copy
      invoice" buttons: Telegram buttons can't open lightning: links or copy text
      longer than 256 characters, so they link here instead.

        /pay#<invoice>        shows the invoice with Open wallet / Copy buttons
        /pay#open:<invoice>   also hands it to the wallet immediately

      The invoice is in the URL fragment, which browsers never send to the
      server, so it doesn't end up in server logs. No analytics on this page
      for the same reason.
    -->
    <style>
      @font-face {
        font-family: 'Poppins';
        src: url('/public/fonts/Poppins-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('/public/fonts/Poppins-Bold.ttf') format('truetype');
        font-weight: 700;
        font-display: swap;
      }
      :root {
        --color-brand: #0375f6;
        --color-ink: #121111;
        --color-muted: rgba(18, 17, 17, 0.6);
        --color-bg: #fbfaf7;
        --color-surface: #ffffff;
        --color-hairline: rgba(18, 17, 17, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--color-bg);
        color: var(--color-ink);
        font-family: 'Poppins', sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: var(--color-surface);
        border: 1px solid var(--color-hairline);
        border-radius: 8px;
        padding: 32px 24px 20px;
        box-shadow: 0 22px 52px rgba(18, 17, 17, 0.09);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin: 16px 0 4px;
      }
      p {
        color: var(--color-muted);
        margin: 0 0 24px;
      }
      code {
        display: block;
        background: var(--color-bg);
        border: 1px solid var(--color-hairline);
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        word-break: break-all;
        max-height: 92px;
        overflow: hidden;
        margin-bottom: 24px;
        text-align: left;
        color: var(--color-muted);
      }
      .btn {
        display: block;
        width: 100%;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 999px;
        border: 2px solid var(--color-brand);
        font: 700 1rem 'Poppins', sans-serif;
        text-decoration: none;
        cursor: pointer;
        background: transparent;
        color: var(--color-brand);
      }
      .primary {
        background: var(--color-brand);
        color: #ffffff;
      }
      .qr {
        display: inline-block;
        background: #ffffff;
        padding: 10px;
        border: 1px solid var(--color-hairline);
        border-radius: 8px;
        line-height: 0;
        margin-bottom: 8px;
      }
      .qr img,
      .qr canvas {
        width: 200px;
        height: 200px;
      }
      .qr-hint {
        font-size: 0.85rem;
        margin-bottom: 20px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <main>
      <img
        src="/public/favicon/web-app-manifest-512x512.png"
        alt="Blitz Wallet"
      />
      <h1 id="amount">Lightning invoice</h1>
      <p id="hint">Pay with any Lightning wallet.</p>
      <div id="invoice-view" hidden>
        <div class="qr" id="qr" aria-label="Invoice QR code"></div>
        <p class="qr-hint">Scan with your phone's wallet, or use the buttons below.</p>
        <code id="invoice"></code>
        <a id="open" class="btn primary" href="#">Open wallet</a>
        <button id="copy" class="btn" type="button">Copy invoice</button>
      </div>
      <p id="error" hidden>
        This link doesn't contain a valid Lightning invoice.
      </p>
    </main>
    <script>
      (function () {
        var hash = decodeURIComponent(location.hash.slice(1));
        var autoOpen = hash.indexOf('open:') === 0;
        var invoice = (autoOpen ? hash.slice(5) : hash).trim().toLowerCase();

        // Only a bech32 BOLT11 invoice is ever put into the page or a link.
        if (!/^ln(bc|tb|bcrt|tbs)[0-9a-z]{20,4000}$/.test(invoice)) {
          document.getElementById('error').hidden = false;
          document.getElementById('hint').hidden = true;
          return;
        }

        // Amount from the human-readable part, e.g. lnbc21u -> 2,100 sats.
        var m = /^ln(?:bc|tb|bcrt|tbs)(\d+)([munp]?)1/.exec(invoice);
        if (m) {
          var msat =
            Number(m[1]) * { m: 1e8, u: 1e5, n: 100, p: 0.1, '': 1e11 }[m[2]];
          if (msat >= 1000) {
            document.getElementById('amount').textContent =
              Math.floor(msat / 1000).toLocaleString('en-US') + ' sats';
          }
        }

        var link = 'lightning:' + invoice;
        if (window.QRCode) {
          // Uppercase is the compact QR form for BOLT11 (alphanumeric mode).
          new QRCode(document.getElementById('qr'), {
            text: 'LIGHTNING:' + invoice.toUpperCase(),
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.M,
          });
        } else {
          document.getElementById('qr').hidden = true;
        }
        document.getElementById('invoice').textContent = invoice;
        document.getElementById('open').href = link;
        document.getElementById('invoice-view').hidden = false;

        var copy = document.getElementById('copy');
        copy.addEventListener('click', function () {
          function done() {
            copy.textContent = 'Copied ✓';
          }
          function fallback() {
            var area = document.createElement('textarea');
            area.value = invoice;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            area.remove();
            done();
          }
          if (navigator.clipboard) {
            navigator.clipboard.writeText(invoice).then(done, fallback);
          } else {
            fallback();
          }
        });

        if (autoOpen) location.href = link;
      })();
    </script>
  </body>
</html>
